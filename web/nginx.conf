server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exact health probe for the web container itself.
    location = /web-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Proxy API calls and the API health probe to the FastAPI service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
