name: centrifuge-audit

services:
  api:
    build: ./api
    image: centrifuge-audit-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    image: centrifuge-audit-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性验收服务：对真实运行的 API 与 Web 代理执行接口验收，
  # 完成后自行退出，退出码 0 表示全部通过、1 表示存在失败。
  verify:
    build: ./verify
    image: centrifuge-audit-verify
    environment:
      API_BASE: http://api:8000
      WEB_BASE: http://web:80
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"
